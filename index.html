<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>40timer</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui, sans-serif;margin:16px;background:#f5f5f5}
h1{margin:0 0 12px;font-size:22px}
.container{max-width:1100px;margin:0 auto}
.group{background:#fff;padding:16px;border-radius:10px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
.group-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:18px;font-weight:bold}
.timer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.timer-btn{padding:12px 8px;border:none;border-radius:8px;font-size:16px;cursor:pointer;color:#fff;min-height:72px;transition:.2s;background:#666}
.timer-btn.running{background:#28a745}
.timer-btn.paused{background:#f0ad4e;color:#222}
.timer-btn.over50{background:#dc3545!important;}
.help-btn{position:fixed;bottom:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:#fff;padding:20px;border-radius:10px;max-width:500px}
.modal-box h2{margin-top:0}
.modal-close{margin-top:12px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>40timer</h1>
<div class="group">
<div class="group-title">A组 <span>累计时间</span></div>
<div class="timer-grid" id="groupA"></div>
</div>
<div class="group">
<div class="group-title">B组 <span>累计时间</span></div>
<div class="timer-grid" id="groupB"></div>
</div>
</div>
<button class="help-btn" id="helpBtn">?</button>
<div class="modal" id="helpModal">
<div class="modal-box">
<h2>使用说明</h2>
<p>点击按钮开始计时，再次点击暂停。<br>时间格式：分:秒，超过50分钟按钮会变成红色。</p>
<button class="modal-close" id="closeModal">关闭</button>
</div>
</div>
<script>
const COUNT_PER_GROUP = 20;
const state = {
  A: Array(COUNT_PER_GROUP).fill(null).map(()=>({seconds:0,running:false,timerId:null})),
  B: Array(COUNT_PER_GROUP).fill(null).map(()=>({seconds:0,running:false,timerId:null}))
};

function formatTime(totalSec){
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function renderGroup(groupKey, el){
  el.innerHTML = '';
  state[groupKey].forEach((item, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'timer-btn';
    const label = `${groupKey}${idx+1}`;
    btn.dataset.g = groupKey;
    btn.dataset.i = idx;

    if(item.running) btn.classList.add('running');
    else if(item.seconds>0) btn.classList.add('paused');

    if(item.seconds >= 50*60){
      btn.classList.add('over50');
    }

    btn.textContent = label + '\n' + formatTime(item.seconds);
    btn.onclick = ()=>toggleTimer(groupKey, idx);
    el.appendChild(btn);
  })
}

function toggleTimer(g, i){
  const item = state[g][i];
  if(item.running){
    clearInterval(item.timerId);
    item.running = false;
  }else{
    item.running = true;
    item.timerId = setInterval(()=>{
      item.seconds += 1;
      renderAll();
    },1000)
  }
  renderAll();
}

function renderAll(){
  renderGroup('A', document.getElementById('groupA'));
  renderGroup('B', document.getElementById('groupB'));
}

// help modal
document.getElementById('helpBtn').onclick = ()=>{
  document.getElementById('helpModal').classList.add('show');
}
document.getElementById('closeModal').onclick = ()=>{
  document.getElementById('helpModal').classList.remove('show');
}

renderAll();
</script>
</body>
</html>
