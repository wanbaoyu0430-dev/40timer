<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>40timer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f3f3;font-family:system-ui, sans-serif;}
h1{text-align:center;margin:12px 0;}
.wrap{max-width:1200px;margin:0 auto;padding:8px;}
.group{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;}
.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(110px,1fr));gap:8px;}
.timer{
  border:0;
  border-radius:8px;
  padding:10px 4px;
  min-height:70px;
  font-size:15px;
  color:#fff;
  cursor:pointer;
  white-space:pre-line;
  transition:0.2s;
}
.idle{background:#777;}
.run{background:#28a745;}
.pause{background:#f0ad4e;color:#222;}
.over50{background:#dc3545 !important;}
.ctrl-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.ctrl-btn{padding:8px 12px;border:0;border-radius:6px;background:#444;color:#fff;cursor:pointer;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.modal-inner{background:#fff;padding:20px;border-radius:10px;max-width:480px}
</style>
</head>
<body>
<div class="wrap">
<h1>40timer</h1>
<div class="ctrl-row">
<button class="ctrl-btn" id="pauseAll">全部暂停</button>
<button class="ctrl-btn" id="resetAll">全部清零</button>
<button class="ctrl-btn" id="helpBtn">说明</button>
</div>

<div class="group">
<div class="group-head">A组 <span id="sumA">合计：00:00</span></div>
<div class="grid" id="gridA"></div>
</div>

<div class="group">
<div class="group-head">B组 <span id="sumB">合计：00:00</span></div>
<div class="grid" id="gridB"></div>
</div>
</div>

<div class="modal" id="helpModal">
<div class="modal-inner">
<h2>使用说明</h2>
<p>点击按钮开始/暂停计时<br>长按按钮清零单个计时器<br>时间格式：分:秒，累计≥50分钟按钮变红</p>
<button class="ctrl-btn" id="closeHelp">关闭</button>
</div>
</div>

<script>
const KEY = 'timer40data';
const COUNT = 20;
let data = loadData();

// 格式化：分:秒
function format(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function makeBlank(){
  return Array(COUNT).fill(null).map(()=>({sec:0,run:false,timer:null}));
}
function loadData(){
  const raw = localStorage.getItem(KEY);
  if(!raw) return {A:makeBlank(), B:makeBlank()};
  try{return JSON.parse(raw);}catch(e){return {A:makeBlank(), B:makeBlank()};}
}
function saveData(){
  localStorage.setItem(KEY, JSON.stringify(data));
}

// 渲染单个组
function renderGroup(name, domId, sumDomId){
  const root = document.getElementById(domId);
  const arr = data[name];
  root.innerHTML = '';
  let total = 0;
  arr.forEach((item, idx)=>{
    total += item.sec;
    const btn = document.createElement('button');
    btn.className = 'timer';
    const label = `${name}${idx+1}`;
    btn.dataset.g = name;
    btn.dataset.i = idx;
    if(item.run) btn.classList.add('run');
    else if(item.sec>0) btn.classList.add('pause');
    else btn.classList.add('idle');
    // 超过50分钟变红 50*60=3000秒
    if(item.sec >= 3000) btn.classList.add('over50');

    btn.textContent = label + "\n" + format(item.sec);

    let longPressTimer = null;
    const g = name, i = idx;
    // 单击切换计时
    btn.onclick = ()=>{
      const it = data[g][i];
      if(it.run){
        clearInterval(it.timer);
        it.run = false;
      }else{
        it.run = true;
        it.timer = setInterval(()=>{
          it.sec += 1;
          saveData();
          renderAll();
        },1000);
      }
      saveData();
      renderAll();
    }
    // 长按清零
    btn.onmousedown = btn.ontouchstart = ()=>{
      longPressTimer = setTimeout(()=>{
        const it = data[g][i];
        clearInterval(it.timer);
        it.sec = 0;
        it.run = false;
        saveData();
        renderAll();
      }, 800);
    }
    btn.onmouseup = btn.ontouchend = ()=>{
      clearTimeout(longPressTimer);
    }
    root.appendChild(btn);
  })
  document.getElementById(sumDomId).textContent = "合计：" + format(total);
}

function renderAll(){
  renderGroup('A','gridA','sumA');
  renderGroup('B','gridB','sumB');
}

// 全部暂停
document.getElementById('pauseAll').onclick = ()=>{
  ['A','B'].forEach(g=>{
    data[g].forEach(it=>{
      if(it.run){
        clearInterval(it.timer);
        it.run = false;
      }
    })
  })
  saveData();renderAll();
}
// 全部清零
document.getElementById('resetAll').onclick = ()=>{
  ['A','B'].forEach(g=>{
    data[g].forEach(it=>{
      clearInterval(it.timer);
      it.sec = 0;
      it.run = false;
    })
  })
  saveData();renderAll();
}

// 弹窗
document.getElementById('helpBtn').onclick = ()=>{
  document.getElementById('helpModal').classList.add('show');
}
document.getElementById('closeHelp').onclick = ()=>{
  document.getElementById('helpModal').classList.remove('show');
}

renderAll();
</script>
</body>
</html>
