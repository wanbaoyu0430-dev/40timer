<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>40timer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
body{background:#f4f4f4;padding:12px;}
h1{text-align:center;margin-bottom:12px;}
.ctrl-bar{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.ctrl-bar button{padding:8px 14px;border:none;border-radius:6px;background:#333;color:#fff;font-size:15px;cursor:pointer;}
/* 外层容器：A、B左右并排 */
.container{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1200px;margin:0 auto;}
@media (max-width:768px){
  /* 手机宽度不足，自动改为上下排列 */
  .container{grid-template-columns:1fr;}
}
.group{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0002;}
.group-title{font-size:18px;font-weight:bold;margin-bottom:10px;display:flex;justify-content:space-between;}
/* 每组内部网格：4列，自动5行，4×5 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.timer{
  min-height:70px;border:none;border-radius:8px;color:#fff;font-size:15px;white-space:pre-line;cursor:pointer;transition:0.2s;
}
.idle{background:#666;}
.run{background:#28a745;}
.pause{background:#f0ad4e;color:#222;}
.over50{background:#dc3545 !important;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.modal-inner{background:#fff;padding:20px;border-radius:10px;max-width:460px;}
</style>
</head>
<body>
<h1>40timer</h1>
<div class="ctrl-bar">
<button id="pauseAll">全部暂停</button>
<button id="resetAll">全部清零</button>
<button id="helpBtn">说明</button>
</div>

<div class="container">
  <!-- A组 4×5 -->
  <div class="group">
    <div class="group-title">A组 <span id="sumA">合计：00:00</span></div>
    <div class="grid" id="gridA"></div>
  </div>
  <!-- B组 4×5 -->
  <div class="group">
    <div class="group-title">B组 <span id="sumB">合计：00:00</span></div>
    <div class="grid" id="gridB"></div>
  </div>
</div>

<div class="modal" id="helpModal">
<div class="modal-inner">
<h2>使用说明</h2>
<p>单击：开始/暂停<br>长按按钮：单个清零<br>格式：分:秒；超过50分钟按钮变红</p>
<button id="closeHelp">关闭</button>
</div>
</div>

<script>
const KEY = 'timer40data';
const COUNT = 20;
// 格式化 分:秒
function format(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}
function blankGroup(){
  return Array(COUNT).fill(null).map(()=>({sec:0,run:false,timer:null}));
}
function load(){
  const raw = localStorage.getItem(KEY);
  if(!raw) return {A:blankGroup(),B:blankGroup()};
  try{return JSON.parse(raw);}catch{return {A:blankGroup(),B:blankGroup()};}
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
let data = load();

function renderGroup(name,domId,sumId){
  const dom = document.getElementById(domId);
  dom.innerHTML = '';
  let total=0;
  data[name].forEach((item,idx)=>{
    total += item.sec;
    const btn = document.createElement('button');
    btn.className="timer";
    const label = `${name}${idx+1}`;
    if(item.run) btn.classList.add('run');
    else if(item.sec>0) btn.classList.add('pause');
    else btn.classList.add('idle');
    if(item.sec >= 50*60) btn.classList.add('over50');
    btn.textContent = label + "\n"+format(item.sec);

    let longTimer=null;
    const g=name,i=idx;
    btn.onclick=()=>{
      const it = data[g][i];
      if(it.run){clearInterval(it.timer);it.run=false;}
      else{
        it.run=true;
        it.timer=setInterval(()=>{it.sec++;save();renderAll();},1000);
      }
      save();renderAll();
    }
    //长按清零
    btn.addEventListener('touchstart',()=>{longTimer=setTimeout(()=>{
      const it=data[g][i];clearInterval(it.timer);it.sec=0;it.run=false;save();renderAll();
    },800);});
    btn.addEventListener('touchend',()=>clearTimeout(longTimer));
    btn.onmousedown=()=>{longTimer=setTimeout(()=>{
      const it=data[g][i];clearInterval(it.timer);it.sec=0;it.run=false;save();renderAll();
    },800);};
    btn.onmouseup=()=>clearTimeout(longTimer);
    dom.appendChild(btn);
  })
  document.getElementById(sumId).textContent="合计："+format(total);
}
function renderAll(){
  renderGroup('A','gridA','sumA');
  renderGroup('B','gridB','sumB');
}

//全部暂停
document.getElementById('pauseAll').onclick=()=>{
  ['A','B'].forEach(g=>data[g].forEach(it=>{if(it.run){clearInterval(it.timer);it.run=false;}}));
  save();renderAll();
}
//全部清零
document.getElementById('resetAll').onclick=()=>{
  ['A','B'].forEach(g=>data[g].forEach(it=>{clearInterval(it.timer);it.sec=0;it.run=false;}));
  save();renderAll();
}
document.getElementById('helpBtn').onclick=()=>document.getElementById('helpModal').classList.add('show');
document.getElementById('closeHelp').onclick=()=>document.getElementById('helpModal').classList.remove('show');
renderAll();
</script>
</body>
</html>
